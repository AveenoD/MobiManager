      tags: [AI]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE stream until job completes or fails
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized

