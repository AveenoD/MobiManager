          description: Match or candidate list
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden for sub-admin without permission

  /api/dict/{kind}:
    get:
      summary: Search dictionary values
      tags: [Dictionary]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [brand, model, category, issue, operator]
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Dictionary values
        '400':
          description: Invalid kind or query
        '401':
          description: Unauthorized
    post:
      summary: Upsert dictionary value
      tags: [Dictionary]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [brand, model, category, issue, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Value stored
        '400':
          description: Validation failed
        '401':
          description: Unauthorized

  /api/dict/{kind}/{id}/touch:
    post:
      summary: Bump dictionary entry usage (useCount, lastUsedAt)
      tags: [Dictionary]
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [brand, model, category, issue, operator]
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Entry touched
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

